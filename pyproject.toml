[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Same import layout as Home Assistant core
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
